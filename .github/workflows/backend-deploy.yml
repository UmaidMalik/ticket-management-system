name: Backend Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "incident-management-backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd "${{ secrets.BACKEND_PROJECT_PATH }}"

            echo "Pulling latest code..."
            git pull origin main

            echo "Writing runtime environment file..."
            printf "JWT_SECRET=%s\n" "${{ secrets.JWT_SECRET }}" > .env

            echo "Rebuilding backend container only..."
            docker compose up -d --build --no-deps backend

            echo "Current containers:"
            docker compose ps

            echo "Waiting for backend to become healthy..."
            for i in {1..30}; do
              if curl -fsS http://localhost:5000/tickets > /dev/null; then
                echo "Backend is healthy."
                exit 0
              fi

              echo "Backend not ready yet. Retrying in 3 seconds..."
              sleep 3
            done

            echo "Backend health check failed."
            docker compose logs backend --tail=100
            exit 1